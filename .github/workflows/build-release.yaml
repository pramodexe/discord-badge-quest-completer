name: 'Build and release'

# Run it by hand: Actions tab -> "Build and release" -> Run workflow.
# It builds Windows and Linux and creates a DRAFT release (tag v<version> from
# src-tauri/tauri.conf.json) with every file and a SHA-256 checksum list.
# Check it, then publish it.
#
# There is deliberately no "on tag push" trigger: publishing a release creates
# its tag, and that would start a second build that turns the release back
# into a draft.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NAME: discord-badge-quest-completer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
          # The oldest supported Ubuntu, so the Linux files also run on newer
          # systems (Debian 12, Ubuntu 24.04, Arch, Fedora...).
          - platform: ubuntu-22.04
            os: linux

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./src-win -> target
            ./src-linux -> target

      - name: Install Linux build libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Refresh the bundled game list (keeps the old one if Discord does not answer)
        run: |
          if curl -fsSL -o /tmp/gamelist.json "https://discord.com/api/v10/applications/detectable" \
             && [ -s /tmp/gamelist.json ]; then
            mv /tmp/gamelist.json src/assets/gamelist.json
          else
            echo "::warning::Could not refresh the game list; using the one in the repository."
          fi

      - name: Build the stand-in program (Windows)
        if: matrix.os == 'windows'
        run: |
          (cd src-win && cargo build --release)
          cp src-win/target/release/src-win.exe src-tauri/resources/src-win.exe

      - name: Build the stand-in program (Linux)
        if: matrix.os == 'linux'
        run: |
          (cd src-linux && cargo build --release)
          cp src-linux/target/release/src-linux src-tauri/resources/src-linux

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: Build the app (Windows)
        if: matrix.os == 'windows'
        run: pnpm tauri build --bundles nsis

      - name: Build the app (Linux)
        if: matrix.os == 'linux'
        env:
          NO_STRIP: "true"   # linuxdeploy's old strip cannot read some newer binaries
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Collect files with plain names
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          b=src-tauri/target/release/bundle
          if [ "${{ matrix.os }}" = windows ]; then
            cp src-tauri/target/release/discord-quest-completer.exe "out/${NAME}-${version}-windows-portable.exe"
            cp $b/nsis/*-setup.exe "out/${NAME}-${version}-windows-setup.exe"
          else
            cp $b/appimage/*.AppImage "out/${NAME}-${version}-x86_64.AppImage"
            cp $b/deb/*.deb "out/${NAME}_${version}_amd64.deb"
            cp $b/rpm/*.rpm "out/${NAME}-${version}.x86_64.rpm"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.version }}
          # Tag the exact commit that was built (not whatever the default branch is).
          target_commitish: ${{ github.sha }}
          name: v${{ env.version }}
          draft: true
          generate_release_notes: true
          files: out/*
          body: |
            ### Downloads

            | System | File |
            |---|---|
            | Windows (no install) | `*-windows-portable.exe` |
            | Windows (installer) | `*-windows-setup.exe` |
            | Any Linux: Arch, CachyOS, Ubuntu, Debian, Fedora, Mint... | `*.AppImage` |
            | Debian, Ubuntu, Mint, Pop!_OS | `*.deb` |
            | Fedora, openSUSE | `*.rpm` |

            Install steps for each system are in the [README](https://github.com/${{ github.repository }}#download-and-install). Check a download against `SHA256SUMS.txt`.

            #### Disclaimer
            This tool is for educational purposes and personal use. Faking game activity may go against Discord's Terms of Service. Use at your own risk. This project is not affiliated with, endorsed by, or connected to Discord in any way.
