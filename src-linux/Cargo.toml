[package]
name = "src-linux"
version = "0.2.0"
edition = "2021"

# GTK 3, the same toolkit the main app needs on Linux, so the stand-in runs on
# any desktop that can run the app (GTK 4 is missing on many KDE setups).
[dependencies]
gtk = "0.18"

[[bin]]
name = "src-linux"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
